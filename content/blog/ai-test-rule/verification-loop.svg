<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B7CFA"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="640" fill="#FFFFFF"/>
  <text x="540" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">AI 에이전트 개발 루프와 검증 지점</text>

  <!-- Loop boundary -->
  <rect x="60" y="60" width="960" height="140" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <rect x="792" y="66" width="222" height="26" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="903" y="83.5" text-anchor="middle" font-size="11.5" fill="#92400E">구현자 = 검증자, 동일 컨텍스트</text>

  <!-- 4 loop boxes -->
  <rect x="140" y="95" width="170" height="70" rx="10" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <rect x="350" y="95" width="170" height="70" rx="10" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <rect x="560" y="95" width="170" height="70" rx="10" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <rect x="770" y="95" width="170" height="70" rx="10" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>

  <line x1="310" y1="130" x2="350" y2="130" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="130" x2="560" y2="130" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="130" x2="770" y2="130" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M855,165 C855,188 225,188 225,165" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="177" text-anchor="middle" font-size="11" fill="#64748B">반복 수정</text>

  <text x="225" y="135" text-anchor="middle" font-size="15" fill="#1F2937">구현</text>
  <text x="435" y="135" text-anchor="middle" font-size="14.5" fill="#1F2937">테스트 작성</text>
  <text x="645" y="135" text-anchor="middle" font-size="13.5" fill="#1F2937">실행 · 실패 분석</text>
  <text x="855" y="135" text-anchor="middle" font-size="15" fill="#1F2937">수정</text>

  <!-- Arrow down to Green box -->
  <line x1="540" y1="200" x2="540" y2="258" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Green box -->
  <rect x="400" y="260" width="280" height="60" rx="10" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <text x="540" y="286" text-anchor="middle" font-size="14.5" fill="#1F2937">자기 선언: 테스트 통과</text>
  <text x="540" y="306" text-anchor="middle" font-size="13" fill="#475569">(Green)</text>

  <!-- Warning badge -->
  <line x1="680" y1="290" x2="718" y2="290" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="720" y="262" width="300" height="56" rx="8" fill="#FEF2F2" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="870" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B45309">Reward Hacking 위험</text>
  <text x="870" y="302" text-anchor="middle" font-size="11.5" fill="#92400E">통과 기준 자체가 흔들릴 수 있다</text>

  <!-- Arrow down to Independent Verification -->
  <line x1="540" y1="320" x2="540" y2="368" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="565" y="348" font-size="11.5" fill="#64748B">그대로 병합하지 않는다</text>

  <!-- Independent Verification box -->
  <rect x="350" y="370" width="380" height="65" rx="10" fill="#DCEBFF" stroke="#3653C7" stroke-width="2"/>
  <text x="540" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Independent Verification</text>
  <text x="540" y="419" text-anchor="middle" font-size="12" fill="#334155">별도 컨텍스트의 검증자 (다른 에이전트 또는 사람)</text>

  <!-- Arrow down to Quality Gate -->
  <line x1="540" y1="435" x2="540" y2="466" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Quality Gate box -->
  <rect x="350" y="468" width="380" height="60" rx="10" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <text x="540" y="494" text-anchor="middle" font-size="14.5" fill="#1F2937">Risk 기반 Quality Gate</text>
  <text x="540" y="513" text-anchor="middle" font-size="12" fill="#475569">필수 테스트 레이어 · CI 차단 조건</text>

  <!-- Arrow down to merge -->
  <line x1="540" y1="528" x2="540" y2="561" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Merge box -->
  <rect x="440" y="563" width="200" height="55" rx="24" fill="#4C6EF5" stroke="#3653C7" stroke-width="1.5"/>
  <text x="540" y="596" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">병합</text>
</svg>
