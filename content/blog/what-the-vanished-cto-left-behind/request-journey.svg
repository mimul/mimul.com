<g font-family="'Nanum Pen Script'" fill="#1e1e1e">
<text x="375" y="42" font-size="22" text-anchor="middle">요청 하나가 지나는 길</text>
<text x="55" y="282" font-size="16" text-anchor="middle">사용자</text>
<text x="177" y="132" font-size="18" text-anchor="middle">DNS</text>
<text x="177" y="153" font-size="14" text-anchor="middle" fill="#555">Cloudflare의 IP를 돌려준다</text>
<text x="290" y="282" font-size="14" text-anchor="middle">라우터</text>
<text x="290" y="299" font-size="13" text-anchor="middle" fill="#777">BGP가 가까운</text>
<text x="290" y="315" font-size="13" text-anchor="middle" fill="#777">데이터센터를 고른다</text>
<text x="475" y="122" font-size="17" text-anchor="middle">Cloudflare 데이터센터</text>
<text x="438" y="156" font-size="16" text-anchor="middle">TLS 종료</text>
<text x="438" y="174" font-size="12" text-anchor="middle" fill="#777">연결이 둘이 된다</text>
<text x="438" y="223" font-size="16" text-anchor="middle">DDoS · WAF · 봇 검사</text>
<text x="438" y="241" font-size="12" text-anchor="middle" fill="#777">통과 · 차단 · 추가 검증</text>
<text x="438" y="290" font-size="16" text-anchor="middle">캐시</text>
<text x="438" y="308" font-size="12" text-anchor="middle" fill="#777">적중이면 여기서 응답</text>
<text x="438" y="357" font-size="16" text-anchor="middle">Workers</text>
<text x="438" y="375" font-size="12" text-anchor="middle" fill="#777">고객 코드가 응답을 만든다</text>
<text x="530" y="160" font-size="13" text-anchor="start" fill="#555">암호화</text>
<text x="530" y="227" font-size="13" text-anchor="start" fill="#555">보안</text>
<text x="530" y="294" font-size="13" text-anchor="start" fill="#555">시스템 설계</text>
<text x="530" y="361" font-size="13" text-anchor="start" fill="#555">런타임</text>
<text x="687" y="297" font-size="15" text-anchor="middle">오리진 서버</text>
<text x="572" y="324" font-size="12" text-anchor="middle" fill="#777">미적중일 때만</text>
<text x="682" y="146" font-size="15" text-anchor="middle">대시보드 설정</text>
<text x="690" y="185" font-size="12" text-anchor="middle" fill="#c0604a">몇 초 안에 모든 서버로</text>
<text x="375" y="462" font-size="14" text-anchor="middle" fill="#777">층마다 분야가 다르고, 앞 층의 결정이 뒤 층의 경로를 바꾼다</text>
</g></svg>
