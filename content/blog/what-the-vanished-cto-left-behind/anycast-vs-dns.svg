<g font-family="'Nanum Pen Script'" fill="#1e1e1e">
<text x="185" y="122" font-size="18" text-anchor="middle" fill="#1e1e1e">DNS 서버</text>
<text x="185" y="142" font-size="15" text-anchor="middle" fill="#555">"너는 1.2.3.4로 가라"</text>
<text x="60" y="205" font-size="16" text-anchor="middle" fill="#1e1e1e">사용자</text>
<text x="305" y="239" font-size="15" text-anchor="start" fill="#555">1.2.3.4</text>
<text x="305" y="294" font-size="15" text-anchor="start" fill="#555">5.6.7.8</text>
<text x="305" y="349" font-size="15" text-anchor="start" fill="#555">9.10.11.12</text>
<text x="200" y="310" font-size="16" text-anchor="middle" fill="#555">서버마다 다른 IP</text>
<text x="200" y="330" font-size="15" text-anchor="middle" fill="#777">DNS 응답이 캐시되면</text>
<text x="200" y="348" font-size="15" text-anchor="middle" fill="#777">죽은 서버로도 계속 간다</text>
<text x="190" y="52" font-size="22" text-anchor="middle" fill="#1e1e1e">DNS 기반 CDN</text>
<text x="560" y="52" font-size="22" text-anchor="middle" fill="#1e1e1e">Anycast</text>
<text x="430" y="162" font-size="15" text-anchor="middle" fill="#1e1e1e">서울</text>
<text x="430" y="272" font-size="15" text-anchor="middle" fill="#1e1e1e">도쿄</text>
<text x="430" y="382" font-size="15" text-anchor="middle" fill="#1e1e1e">상파울루</text>
<text x="525" y="100" font-size="14" text-anchor="middle" fill="#555">라우터</text>
<text x="690" y="169" font-size="15" text-anchor="middle" fill="#555">198.41.128.1</text>
<text x="690" y="279" font-size="15" text-anchor="middle" fill="#555">198.41.128.1</text>
<text x="690" y="389" font-size="15" text-anchor="middle" fill="#555">198.41.128.1</text>
<text x="560" y="440" font-size="14" text-anchor="middle" fill="#777">모든 데이터센터가 같은 IP를 BGP로 광고, 라우터가 가장 가까운 쪽을 고른다</text>
<text x="590" y="170" font-size="13" text-anchor="start" fill="#c0604a">BGP 광고</text>
