<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1240" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B7CFA"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="1240" fill="#FFFFFF"/>
  <text x="540" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">논리 삭제 설계 의사결정 차트</text>

  <!-- ===== shapes & connectors ===== -->

  <!-- Start -->
  <rect x="470" y="55" width="140" height="48" rx="24" fill="#4C6EF5" stroke="#3653C7" stroke-width="1.5"/>
  <line x1="540" y1="103" x2="540" y2="140" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Q1 -->
  <polygon points="540,145 750,210 540,275 330,210" fill="#F8FAFC" stroke="#4C6EF5" stroke-width="1.5"/>
  <rect x="50" y="180" width="220" height="60" rx="8" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <line x1="330" y1="210" x2="270" y2="210" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="275" x2="540" y2="320" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Q2 -->
  <polygon points="540,320 770,390 540,460 310,390" fill="#F8FAFC" stroke="#4C6EF5" stroke-width="1.5"/>
  <rect x="830" y="355" width="200" height="70" rx="8" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <line x1="770" y1="390" x2="830" y2="390" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="930,425 930,490 540,490" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="540" y1="460" x2="540" y2="515" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Q3 -->
  <polygon points="540,510 800,595 540,680 280,595" fill="#F8FAFC" stroke="#4C6EF5" stroke-width="1.5"/>
  <rect x="20" y="550" width="220" height="85" rx="8" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <rect x="840" y="550" width="220" height="85" rx="8" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <rect x="430" y="720" width="220" height="80" rx="8" fill="#DCEBFF" stroke="#3653C7" stroke-width="2"/>
  <line x1="280" y1="595" x2="240" y2="595" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="595" x2="840" y2="595" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="680" x2="540" y2="720" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="130,635 130,860 540,860" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <polyline points="950,635 950,860 540,860" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="540" y1="800" x2="540" y2="880" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Q4 -->
  <polygon points="540,880 760,950 540,1020 320,950" fill="#F8FAFC" stroke="#4C6EF5" stroke-width="1.5"/>
  <rect x="810" y="915" width="200" height="70" rx="8" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <line x1="760" y1="950" x2="810" y2="950" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="1020" x2="540" y2="1065" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Q5 -->
  <polygon points="540,1060 770,1135 540,1210 310,1135" fill="#F8FAFC" stroke="#4C6EF5" stroke-width="1.5"/>
  <rect x="50" y="1097" width="220" height="75" rx="8" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <rect x="810" y="1097" width="220" height="75" rx="8" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <line x1="310" y1="1135" x2="270" y2="1135" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="1135" x2="810" y2="1135" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== labels (drawn last, always on top) ===== -->

  <text x="540" y="84" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="600">시작</text>

  <text x="540" y="204" text-anchor="middle" font-size="14.5" fill="#1F2937">액티브·삭제 상태의</text>
  <text x="540" y="222" text-anchor="middle" font-size="14.5" fill="#1F2937">취급이 실제로 다른가?</text>
  <text x="160" y="205" text-anchor="middle" font-size="14" fill="#1F2937">사용자구분 속성만 추가</text>
  <text x="160" y="224" text-anchor="middle" font-size="14" fill="#1F2937">(서브타입 불필요)</text>
  <text x="300" y="200" text-anchor="middle" font-size="13" fill="#64748B">아니오</text>
  <text x="556" y="302" text-anchor="middle" font-size="13" fill="#64748B">예</text>

  <text x="540" y="383" text-anchor="middle" font-size="14.5" fill="#1F2937">삭제를 업무 기록으로</text>
  <text x="540" y="401" text-anchor="middle" font-size="14.5" fill="#1F2937">남겨야 하는가?</text>
  <text x="930" y="386" text-anchor="middle" font-size="13.5" fill="#1F2937">등록말소·BAN 이벤트로</text>
  <text x="930" y="404" text-anchor="middle" font-size="13.5" fill="#1F2937">분리 설계</text>
  <text x="800" y="380" text-anchor="middle" font-size="13" fill="#64748B">예</text>
  <text x="562" y="485" text-anchor="middle" font-size="13" fill="#64748B">아니오</text>

  <text x="540" y="589" text-anchor="middle" font-size="14.5" fill="#1F2937">서브타입을 어떤 방식으로</text>
  <text x="540" y="607" text-anchor="middle" font-size="14.5" fill="#1F2937">구현할까?</text>

  <text x="130" y="583" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">싱글 테이블 상속</text>
  <text x="130" y="605" text-anchor="middle" font-size="12.5" fill="#475569">삭제 포함 검색이</text>
  <text x="130" y="621" text-anchor="middle" font-size="12.5" fill="#475569">잦을 때</text>

  <text x="950" y="583" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">구체 테이블 상속</text>
  <text x="950" y="605" text-anchor="middle" font-size="12.5" fill="#475569">개인정보 격리·성능이</text>
  <text x="950" y="621" text-anchor="middle" font-size="12.5" fill="#475569">중요할 때</text>

  <text x="540" y="753" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">클래스 테이블 상속</text>
  <text x="540" y="774" text-anchor="middle" font-size="12.5" fill="#334155">횡단 검색 + FK 모두</text>
  <text x="540" y="790" text-anchor="middle" font-size="12.5" fill="#334155">필요할 때 (기본)</text>

  <text x="540" y="943" text-anchor="middle" font-size="14" fill="#1F2937">이벤트가 참조하는 사용자 정보는</text>
  <text x="540" y="961" text-anchor="middle" font-size="14.5" fill="#1F2937">항상 최신이면 되는가?</text>
  <text x="910" y="946" text-anchor="middle" font-size="13.5" fill="#1F2937">이벤트가 사용자ID</text>
  <text x="910" y="964" text-anchor="middle" font-size="13.5" fill="#1F2937">(FK)만 보유</text>
  <text x="785" y="940" text-anchor="middle" font-size="13" fill="#64748B">예</text>
  <text x="562" y="1045" text-anchor="middle" font-size="13" fill="#64748B">아니오</text>

  <text x="540" y="1129" text-anchor="middle" font-size="14.5" fill="#1F2937">과거 시점 상태를</text>
  <text x="540" y="1147" text-anchor="middle" font-size="14.5" fill="#1F2937">어떻게 보존할까?</text>

  <text x="160" y="1128" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">스냅샷 방식</text>
  <text x="160" y="1150" text-anchor="middle" font-size="12.5" fill="#475569">구현 단순함이</text>
  <text x="160" y="1166" text-anchor="middle" font-size="12.5" fill="#475569">우선일 때</text>

  <text x="920" y="1128" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">세대 관리 방식</text>
  <text x="920" y="1150" text-anchor="middle" font-size="12.5" fill="#475569">이력 추적·중복</text>
  <text x="920" y="1166" text-anchor="middle" font-size="12.5" fill="#475569">최소화가 중요할 때</text>
</svg>
