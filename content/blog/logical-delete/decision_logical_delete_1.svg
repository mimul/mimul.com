<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1900" viewBox="0 0 950 1900">
  <!-- 논리 삭제 설계 의사결정 흐름 (손그림 스타일). 이벤트 분기는 종결이 아니라 서브타입 구현 단계로 합류한다. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="h-pink" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#fbeef0"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#f2b8c0" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-blue" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#eef4fb"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#b9d3ee" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-green" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#eff6f0"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#bcdcc1" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-peach" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#fbf0ec"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#efc2b4" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-yellow" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#fcf7e8"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#eed9a6" stroke-width="1.3"/>
    </pattern>
  </defs>

  <rect width="950" height="1900" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 시작 -->
    <ellipse cx="475" cy="60" rx="52" ry="28" fill="#ffffff"/>
    <path d="M475,88 L475,118" fill="none" marker-end="url(#arrow)"/>

    <!-- D1 취급이 다른가 -->
    <polygon points="475,125 645,220 475,315 305,220" fill="#ffffff"/>
    <path d="M305,220 C250,240 170,300 150,395" fill="none" marker-end="url(#arrow)"/>
    <rect x="25" y="400" width="250" height="60" rx="4" fill="url(#h-pink)"/>
    <path d="M475,315 L475,398" fill="none" marker-end="url(#arrow)"/>

    <!-- D2 업무 기록 -->
    <polygon points="475,405 645,500 475,595 305,500" fill="#ffffff"/>
    <path d="M305,500 C260,540 220,600 205,682" fill="none" marker-end="url(#arrow)"/>
    <rect x="60" y="688" width="290" height="64" rx="4" fill="url(#h-blue)"/>
    <path d="M205,752 C205,800 420,760 466,792" fill="none" marker-end="url(#arrow)"/>
    <path d="M475,595 L475,798" fill="none" marker-end="url(#arrow)"/>

    <!-- D3 서브타입 구현 -->
    <polygon points="475,805 665,900 475,995 285,900" fill="#ffffff"/>
    <path d="M285,900 C240,930 190,990 165,1062" fill="none" marker-end="url(#arrow)"/>
    <path d="M475,995 L475,1062" fill="none" marker-end="url(#arrow)"/>
    <path d="M665,900 C710,930 760,990 785,1062" fill="none" marker-end="url(#arrow)"/>
    <rect x="50" y="1070" width="230" height="60" rx="4" fill="url(#h-green)"/>
    <rect x="360" y="1070" width="230" height="60" rx="4" fill="url(#h-peach)"/>
    <rect x="650" y="1070" width="280" height="60" rx="4" fill="url(#h-yellow)"/>
    <!-- 세 패턴이 합류 -->
    <path d="M165,1130 C165,1200 300,1210 470,1212" fill="none"/>
    <path d="M475,1130 L475,1212" fill="none"/>
    <path d="M790,1130 C790,1200 650,1210 480,1212" fill="none"/>
    <path d="M475,1212 L475,1262" fill="none" marker-end="url(#arrow)"/>

    <!-- D4 항상 최신이면 되는가 -->
    <polygon points="475,1270 695,1370 475,1470 255,1370" fill="#ffffff"/>
    <path d="M255,1370 C200,1420 150,1500 140,1582" fill="none" marker-end="url(#arrow)"/>
    <rect x="25" y="1590" width="230" height="60" rx="4" fill="url(#h-blue)"/>
    <path d="M475,1470 L475,1522" fill="none" marker-end="url(#arrow)"/>

    <!-- D5 과거 시점 보존 -->
    <polygon points="475,1530 645,1620 475,1710 305,1620" fill="#ffffff"/>
    <path d="M475,1710 C440,1740 370,1760 340,1792" fill="none" marker-end="url(#arrow)"/>
    <path d="M475,1710 C520,1740 600,1760 630,1792" fill="none" marker-end="url(#arrow)"/>
    <rect x="225" y="1800" width="210" height="60" rx="4" fill="url(#h-pink)"/>
    <rect x="510" y="1800" width="270" height="60" rx="4" fill="url(#h-yellow)"/>
  </g>

  <g font-family="'Nanum Pen Script'" fill="#1e1e1e" text-anchor="middle">
    <text x="475" y="71" font-size="32">시작</text>

    <text x="475" y="212" font-size="32">
      <tspan x="475" dy="0">액티브·삭제 상태의</tspan>
      <tspan x="475" dy="36">취급이 실제로 다른가?</tspan>
    </text>
    <text x="200" y="322" font-size="28">아니오</text>
    <text x="150" y="441" font-size="29">사용자구분 속성만 추가</text>
    <text x="500" y="370" font-size="28">예</text>

    <text x="475" y="492" font-size="32">
      <tspan x="475" dy="0">삭제를 업무 기록으로</tspan>
      <tspan x="475" dy="36">남겨야 하는가?</tspan>
    </text>
    <text x="300" y="632" font-size="28">예</text>
    <text x="205" y="731" font-size="29">자진탈퇴·강제탈퇴 이벤트 추가</text>
    <text x="505" y="702" font-size="28">아니오</text>

    <text x="475" y="892" font-size="32">
      <tspan x="475" dy="0">서브타입을 어떤 방식으로</tspan>
      <tspan x="475" dy="36">구현할까?</tspan>
    </text>
    <text x="165" y="1111" font-size="29">싱글 테이블 상속</text>
    <text x="475" y="1111" font-size="29">구체 테이블 상속</text>
    <text x="790" y="1111" font-size="29">클래스 테이블 상속(기본)</text>

    <text x="475" y="1362" font-size="32">
      <tspan x="475" dy="0">이벤트가 참조하는 사용자 정보는</tspan>
      <tspan x="475" dy="36">항상 최신이면 되는가?</tspan>
    </text>
    <text x="215" y="1492" font-size="28">예</text>
    <text x="140" y="1631" font-size="29">사용자ID만 보유</text>
    <text x="505" y="1507" font-size="28">아니오</text>

    <text x="475" y="1612" font-size="32">
      <tspan x="475" dy="0">과거 시점 상태를</tspan>
      <tspan x="475" dy="36">어떻게 보존할까?</tspan>
    </text>
    <text x="330" y="1841" font-size="29">스냅샷 방식</text>
    <text x="645" y="1841" font-size="29">버전 관리(시점 기준)</text>
  </g>
</svg>
