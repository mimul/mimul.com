<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="620" fill="#FFFFFF"/>
  <text x="650" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">슈퍼타입/서브타입 구현 3패턴</text>

  <!-- Column headers -->
  <text x="210" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">싱글 테이블 상속</text>
  <text x="600" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">구체 테이블 상속</text>
  <text x="1055" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">클래스 테이블 상속</text>

  <!-- Column 1: 싱글 테이블 상속 -->
  <rect x="40" y="90" width="340" height="300" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="210" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">회원</text>
  <line x1="56" y1="134" x2="364" y2="134" stroke="#CBD5E1" stroke-width="1"/>

  <circle cx="56" cy="158" r="3.2" fill="#94A3B8"/><text x="68" y="162" font-size="12.5" fill="#334155">회원ID</text>
  <circle cx="56" cy="182" r="3.2" fill="#94A3B8"/><text x="68" y="186" font-size="12.5" fill="#334155">회원구분</text>
  <circle cx="56" cy="206" r="3.2" fill="#94A3B8"/><text x="68" y="210" font-size="12.5" fill="#334155">등급</text>
  <circle cx="56" cy="230" r="3.2" fill="#4C6EF5"/><text x="68" y="234" font-size="12.5" fill="#2748C4">성명</text>
  <circle cx="56" cy="254" r="3.2" fill="#4C6EF5"/><text x="68" y="258" font-size="12.5" fill="#2748C4">연락처</text>
  <circle cx="56" cy="278" r="3.2" fill="#4C6EF5"/><text x="68" y="282" font-size="12.5" fill="#2748C4">적립금</text>
  <circle cx="56" cy="302" r="3.2" fill="#F59E0B"/><text x="68" y="306" font-size="12.5" fill="#B45309">소거여부</text>
  <circle cx="56" cy="326" r="3.2" fill="#F59E0B"/><text x="68" y="330" font-size="12.5" fill="#B45309">보존기한</text>

  <text x="210" y="355" text-anchor="middle" font-size="11" fill="#64748B">탈퇴 회원 행에서는</text>
  <text x="210" y="372" text-anchor="middle" font-size="11" fill="#64748B">성명·연락처·적립금이 NULL</text>

  <!-- Column 2: 구체 테이블 상속 -->
  <rect x="430" y="90" width="340" height="190" rx="10" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <text x="600" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">활성 회원</text>
  <line x1="446" y1="134" x2="754" y2="134" stroke="#B9CCFB" stroke-width="1"/>
  <circle cx="446" cy="158" r="3.2" fill="#4C6EF5"/><text x="458" y="162" font-size="12.5" fill="#334155">회원ID</text>
  <circle cx="446" cy="182" r="3.2" fill="#4C6EF5"/><text x="458" y="186" font-size="12.5" fill="#334155">등급</text>
  <circle cx="446" cy="206" r="3.2" fill="#4C6EF5"/><text x="458" y="210" font-size="12.5" fill="#334155">성명</text>
  <circle cx="446" cy="230" r="3.2" fill="#4C6EF5"/><text x="458" y="234" font-size="12.5" fill="#334155">연락처</text>
  <circle cx="446" cy="254" r="3.2" fill="#4C6EF5"/><text x="458" y="258" font-size="12.5" fill="#334155">적립금</text>

  <rect x="430" y="300" width="340" height="150" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="600" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">탈퇴 회원</text>
  <line x1="446" y1="344" x2="754" y2="344" stroke="#FCD9A0" stroke-width="1"/>
  <circle cx="446" cy="368" r="3.2" fill="#F59E0B"/><text x="458" y="372" font-size="12.5" fill="#334155">회원ID</text>
  <circle cx="446" cy="392" r="3.2" fill="#F59E0B"/><text x="458" y="396" font-size="12.5" fill="#334155">등급</text>
  <circle cx="446" cy="416" r="3.2" fill="#F59E0B"/><text x="458" y="420" font-size="12.5" fill="#334155">소거여부</text>
  <text x="600" y="480" text-anchor="middle" font-size="11" fill="#64748B">"회원" 테이블은 없다</text>

  <!-- Column 3: 클래스 테이블 상속 -->
  <rect x="965" y="90" width="180" height="120" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1055" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">회원</text>
  <line x1="981" y1="134" x2="1129" y2="134" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="981" cy="158" r="3.2" fill="#94A3B8"/><text x="993" y="162" font-size="12.5" fill="#334155">회원ID</text>
  <circle cx="981" cy="182" r="3.2" fill="#94A3B8"/><text x="993" y="186" font-size="12.5" fill="#334155">회원구분 · 등급</text>

  <line x1="1015" y1="210" x2="965" y2="250" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowC)"/>
  <line x1="1095" y1="210" x2="1145" y2="250" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <rect x="865" y="252" width="180" height="150" rx="10" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <text x="955" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">활성 회원</text>
  <line x1="877" y1="290" x2="1033" y2="290" stroke="#B9CCFB" stroke-width="1"/>
  <text x="955" y="310" text-anchor="middle" font-size="11.5" fill="#334155">회원ID (FK)</text>
  <text x="955" y="330" text-anchor="middle" font-size="11.5" fill="#334155">성명 · 연락처</text>
  <text x="955" y="350" text-anchor="middle" font-size="11.5" fill="#334155">적립금</text>

  <rect x="1065" y="252" width="180" height="150" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1155" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">탈퇴 회원</text>
  <line x1="1077" y1="290" x2="1233" y2="290" stroke="#FCD9A0" stroke-width="1"/>
  <text x="1155" y="310" text-anchor="middle" font-size="11.5" fill="#334155">회원ID (FK)</text>
  <text x="1155" y="330" text-anchor="middle" font-size="11.5" fill="#334155">소거여부</text>
  <text x="1155" y="350" text-anchor="middle" font-size="11.5" fill="#334155">보존기한</text>

  <text x="1055" y="440" text-anchor="middle" font-size="11" fill="#64748B">상세 속성이 필요하면</text>
  <text x="1055" y="457" text-anchor="middle" font-size="11" fill="#64748B">회원ID로 JOIN</text>

  <!-- legend -->
  <circle cx="330" cy="560" r="3.2" fill="#94A3B8"/><text x="342" y="564" font-size="11.5" fill="#64748B">공통 속성</text>
  <circle cx="450" cy="560" r="3.2" fill="#4C6EF5"/><text x="462" y="564" font-size="11.5" fill="#64748B">활성 회원 전용</text>
  <circle cx="600" cy="560" r="3.2" fill="#F59E0B"/><text x="612" y="564" font-size="11.5" fill="#64748B">탈퇴 회원 전용</text>
</svg>
