<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 460" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="1140" height="460" fill="#FFFFFF"/>
  <text x="570" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">카테고리-상품, 외래 키 대신 교차 엔티티로</text>

  <!-- Row 1: 분해 전 -->
  <rect x="20" y="128" width="86" height="28" rx="14" fill="#F1F5F9"/>
  <text x="63" y="147" text-anchor="middle" font-size="12.5" fill="#475569" font-weight="700">분해 전</text>

  <rect x="140" y="98" width="220" height="90" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="250" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">카테고리 (R)</text>
  <text x="250" y="158" text-anchor="middle" font-size="12" fill="#64748B">카테고리ID</text>

  <rect x="560" y="88" width="270" height="110" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="695" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">상품 (R)</text>
  <text x="695" y="146" text-anchor="middle" font-size="12" fill="#334155">상품ID</text>
  <text x="695" y="170" text-anchor="middle" font-size="12" fill="#B45309" font-weight="600">카테고리ID (nullable)</text>

  <line x1="360" y1="143" x2="560" y2="143" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="460" y="130" text-anchor="middle" font-size="12" fill="#64748B">1 : N (FK)</text>

  <rect x="855" y="105" width="255" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="982" y="124" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B91C1C">분류 시점에 UPDATE 발생</text>
  <text x="982" y="142" text-anchor="middle" font-size="10.5" fill="#B91C1C">미분류 상태는 NULL로 대기</text>

  <!-- Row 2: 분해 후 -->
  <rect x="20" y="308" width="86" height="28" rx="14" fill="#F1F5F9"/>
  <text x="63" y="327" text-anchor="middle" font-size="12.5" fill="#475569" font-weight="700">분해 후</text>

  <rect x="140" y="278" width="220" height="90" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="250" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">카테고리 (R)</text>
  <text x="250" y="338" text-anchor="middle" font-size="12" fill="#64748B">카테고리ID</text>

  <rect x="460" y="288" width="220" height="70" rx="10" fill="#EAF2FF" stroke="#4C6EF5" stroke-width="1.5"/>
  <text x="570" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">상품 분류</text>
  <text x="570" y="338" text-anchor="middle" font-size="12" fill="#334155">카테고리ID · 상품ID</text>

  <rect x="780" y="278" width="220" height="90" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="890" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">상품 (R)</text>
  <text x="890" y="338" text-anchor="middle" font-size="12" fill="#64748B">상품ID</text>

  <line x1="360" y1="323" x2="460" y2="323" stroke="#4C6EF5" stroke-width="1.5"/>
  <line x1="680" y1="323" x2="780" y2="323" stroke="#4C6EF5" stroke-width="1.5"/>
  <text x="410" y="308" text-anchor="middle" font-size="11" fill="#64748B">참조</text>
  <text x="730" y="308" text-anchor="middle" font-size="11" fill="#64748B">참조</text>

  <text x="570" y="420" text-anchor="middle" font-size="12.5" fill="#64748B">양쪽 엔티티는 서로 독립적이고, 분류가 정해지면 상품 분류에 INSERT만 하면 된다</text>
</svg>
