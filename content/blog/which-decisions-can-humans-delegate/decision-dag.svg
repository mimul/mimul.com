<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <!-- 주문 취소 기능 하나에 숨은 의사결정의 DAG와 흔히 보이는 인간/AI 책임 분리선 -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="h-yellow" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#fcf7e8"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#eed9a6" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-blue" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#eef4fb"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#b9d3ee" stroke-width="1.3"/>
    </pattern>
  </defs>
  <rect width="900" height="720" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- D0 -->
    <rect x="340" y="40" width="220" height="56" rx="5" fill="url(#h-yellow)"/>
    <path d="M450,96 L450,118 M450,118 L300,118 L300,142 M450,118 L600,118 L600,142" fill="none"/>
    <path d="M300,142 L300,150" fill="none" marker-end="url(#arrow)"/>
    <path d="M600,142 L600,150" fill="none" marker-end="url(#arrow)"/>
    <!-- D1, D2 -->
    <rect x="190" y="152" width="220" height="56" rx="5" fill="url(#h-yellow)"/>
    <rect x="490" y="152" width="220" height="56" rx="5" fill="url(#h-yellow)"/>
    <path d="M300,208 L300,232 L450,232 M600,208 L600,232 L450,232 L450,258" fill="none" marker-end="url(#arrow)"/>
    <!-- D3 -->
    <rect x="340" y="262" width="220" height="56" rx="5" fill="url(#h-yellow)"/>
    <path d="M400,318 C360,340 330,350 310,370" fill="none" marker-end="url(#arrow)"/>
    <path d="M500,318 C540,340 570,350 590,370" fill="none" marker-end="url(#arrow)"/>
    <!-- D4, D5 -->
    <rect x="190" y="374" width="220" height="56" rx="5" fill="url(#h-yellow)"/>
    <rect x="490" y="374" width="220" height="56" rx="5" fill="url(#h-yellow)"/>
    <path d="M310,430 C350,460 400,470 440,484" fill="none" marker-end="url(#arrow)"/>
    <path d="M590,430 C550,460 500,470 460,484" fill="none" marker-end="url(#arrow)"/>
    <!-- D6 -->
    <rect x="340" y="488" width="220" height="56" rx="5" fill="url(#h-blue)"/>
    <path d="M450,544 L450,590" fill="none" marker-end="url(#arrow)"/>
    <!-- D7 -->
    <rect x="340" y="596" width="220" height="56" rx="5" fill="url(#h-blue)"/>
    <!-- 책임 분리선 -->
    <path d="M60,462 C300,456 600,468 840,460" fill="none" stroke="#c9565e" stroke-width="2.4" stroke-dasharray="14,9"/>
  </g>

  <g font-family="'Nanum Pen Script'" fill="#1e1e1e" text-anchor="middle">
    <text x="450" y="77" font-size="29">D0 취소의 의미</text>
    <text x="300" y="189" font-size="29">D1 취소 가능 조건</text>
    <text x="600" y="189" font-size="29">D2 업무 불변 조건</text>
    <text x="450" y="299" font-size="29">D3 장애 시의 의미</text>
    <text x="300" y="411" font-size="29">D4 트랜잭션 방식</text>
    <text x="600" y="411" font-size="29">D5 멱등성 방식</text>
    <text x="450" y="525" font-size="29">D6 구현 구조</text>
    <text x="450" y="633" font-size="29">D7 구체 코드</text>

    <text x="120" y="300" font-size="27" fill="#555">사람이 쥐는 결정</text>
    <text x="120" y="330" font-size="24" fill="#555">(많은 결정이 기댄다)</text>
    <text x="120" y="560" font-size="27" fill="#555">AI에게 맡기는 결정</text>
    <text x="120" y="590" font-size="24" fill="#555">(테스트로 판정된다)</text>
    <text x="770" y="492" font-size="26" fill="#c9565e">흔히 보이는</text>
    <text x="770" y="522" font-size="26" fill="#c9565e">인간/AI 책임 분리선</text>
  </g>
</svg>
