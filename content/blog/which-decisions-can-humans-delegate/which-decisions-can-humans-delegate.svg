<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
  <!-- 대표 이미지: 사람과 AI 사이, 어떤 결정을 넘길 수 있는가 -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="h-yellow" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#fcf7e8"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#eed9a6" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-blue" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#eef4fb"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#b9d3ee" stroke-width="1.3"/>
    </pattern>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 사람 -->
    <circle cx="120" cy="150" r="20" fill="#ffffff"/>
    <path d="M120,170 L120,236 M120,188 L90,214 M120,188 L150,214 M120,236 L98,282 M120,236 L142,282" fill="none"/>
    <!-- AI -->
    <rect x="720" y="150" width="80" height="66" rx="10" fill="#ffffff"/>
    <circle cx="746" cy="178" r="6" fill="#1e1e1e"/>
    <circle cx="774" cy="178" r="6" fill="#1e1e1e"/>
    <path d="M740,200 L780,200 M760,150 L760,130 M746,130 L774,130" fill="none"/>
    <!-- 가운데 미니 DAG -->
    <rect x="380" y="70" width="120" height="44" rx="5" fill="url(#h-yellow)"/>
    <path d="M440,114 L440,132 M440,132 L380,132 L380,146 M440,132 L500,132 L500,146" fill="none"/>
    <rect x="320" y="150" width="120" height="44" rx="5" fill="url(#h-yellow)"/>
    <rect x="440" y="150" width="120" height="44" rx="5" fill="url(#h-yellow)"/>
    <path d="M380,194 L380,212 L440,212 M500,194 L500,212 L440,212 L440,228" fill="none" marker-end="url(#arrow)"/>
    <rect x="380" y="234" width="120" height="44" rx="5" fill="url(#h-blue)"/>
    <path d="M440,278 L440,300" fill="none" marker-end="url(#arrow)"/>
    <rect x="380" y="306" width="120" height="44" rx="5" fill="url(#h-blue)"/>
    <!-- 분리선 -->
    <path d="M250,218 C350,212 530,224 630,216" fill="none" stroke="#c9565e" stroke-width="2.4" stroke-dasharray="12,8"/>
    <!-- 양쪽 화살표 -->
    <path d="M170,180 L300,180" fill="none" stroke-dasharray="5,6" marker-end="url(#arrow)"/>
    <path d="M580,180 L700,180" fill="none" stroke-dasharray="5,6" marker-end="url(#arrow)"/>
  </g>

  <g font-family="'Nanum Pen Script'" fill="#1e1e1e" text-anchor="middle">
    <text x="440" y="44" font-size="34">어떤 결정을 넘길 수 있는가?</text>
    <text x="120" y="320" font-size="28">사람</text>
    <text x="760" y="262" font-size="28">AI</text>
    <text x="235" y="168" font-size="22" fill="#555">맡긴다</text>
    <text x="640" y="168" font-size="22" fill="#555">맡는다</text>
    <text x="200" y="250" font-size="26" fill="#c9565e">Evaluability</text>
    <text x="640" y="258" font-size="26" fill="#c9565e">Controllability</text>
  </g>
</svg>
