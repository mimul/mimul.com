<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <!-- Evaluability × Controllability 네 칸: 어떤 결정을 AI에게 넘길 수 있는가 -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="h-green" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#eff6f0"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#bcdcc1" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-peach" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#fbf0ec"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#efc2b4" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-blue" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#eef4fb"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#b9d3ee" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-pink" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#fbeef0"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#f2b8c0" stroke-width="1.3"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 축 -->
    <path d="M150,520 L150,60" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M150,520 L850,520" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 네 칸 -->
    <rect x="180" y="90" width="310" height="200" rx="5" fill="url(#h-peach)"/>
    <rect x="510" y="90" width="310" height="200" rx="5" fill="url(#h-green)"/>
    <rect x="180" y="300" width="310" height="200" rx="5" fill="url(#h-pink)"/>
    <rect x="510" y="300" width="310" height="200" rx="5" fill="url(#h-blue)"/>
  </g>

  <g font-family="'Nanum Pen Script'" fill="#1e1e1e" text-anchor="middle">
    <!-- 축 라벨 -->
    <text x="500" y="572" font-size="30">Controllability (틀렸을 때 피해를 제어할 수 있는가) →</text>
    <text x="70" y="290" font-size="30" transform="rotate(-90 70 290)">Evaluability (내부를 몰라도 판정할 수 있는가) →</text>
    <text x="128" y="110" font-size="24" fill="#555">높음</text>
    <text x="128" y="505" font-size="24" fill="#555">낮음</text>
    <text x="200" y="548" font-size="24" fill="#555">낮음</text>
    <text x="800" y="548" font-size="24" fill="#555">높음</text>

    <!-- 왼쪽 위 -->
    <text x="335" y="140" font-size="32">맡기기 어렵다</text>
    <text x="335" y="190" font-size="25" fill="#444">판정은 쉽지만 틀리면 바로 큰 사고</text>
    <text x="335" y="225" font-size="25" fill="#444">예) 운영 DB 마이그레이션 SQL</text>
    <text x="335" y="258" font-size="25" fill="#444">작성과 실행</text>
    <!-- 오른쪽 위 -->
    <text x="665" y="140" font-size="32">맡길 수 있다</text>
    <text x="665" y="190" font-size="25" fill="#444">외부 기준이 판정하고</text>
    <text x="665" y="225" font-size="25" fill="#444">틀려도 되돌릴 수 있다</text>
    <text x="665" y="258" font-size="25" fill="#444">예) 테스트가 지키는 리프 결정</text>
    <!-- 왼쪽 아래 -->
    <text x="335" y="350" font-size="32">맡길 수 없다</text>
    <text x="335" y="400" font-size="25" fill="#444">무엇이 올바른지를 정하는 일</text>
    <text x="335" y="435" font-size="25" fill="#444">자체가 산출물</text>
    <text x="335" y="468" font-size="25" fill="#444">예) 취소의 의미, 업무 불변 조건</text>
    <!-- 오른쪽 아래 -->
    <text x="665" y="350" font-size="32">틀리면 고친다</text>
    <text x="665" y="400" font-size="25" fill="#444">판정 비용이 비싸면 노출을 좁혀</text>
    <text x="665" y="435" font-size="25" fill="#444">실패를 보고 수정한다</text>
    <text x="665" y="468" font-size="25" fill="#444">예) 카나리 뒤에 둔 UI 변경</text>
  </g>
</svg>
