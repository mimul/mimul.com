<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <!-- 측정 가능성의 골짜기: 기계가 판정하는 왼쪽 언덕과 사람의 이해가 필요한 오른쪽 언덕 사이가 U자로 움푹 패여 있다 -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="h-green" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#eff6f0"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#bcdcc1" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-peach" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#fbf0ec"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#efc2b4" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-gray" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#f3f3f1"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#cfcfca" stroke-width="1.3"/>
    </pattern>
  </defs>
  <rect width="900" height="540" fill="#ffffff"/>

  <g filter="url(#rough)">
    <!-- 채움: 왼쪽 언덕, 오른쪽 언덕, 골짜기 바닥이 닿는 지층 -->
    <path d="M40,470 L40,190 C120,186 220,192 300,188 C350,192 392,280 400,420 C410,428 430,432 450,432 L450,470 Z" fill="url(#h-green)" stroke="none"/>
    <path d="M860,470 L860,190 C780,186 680,192 600,188 C550,192 508,280 500,420 C490,428 470,432 450,432 L450,470 Z" fill="url(#h-peach)" stroke="none"/>
    <rect x="40" y="432" width="820" height="38" fill="url(#h-gray)" stroke="none"/>

    <g fill="none" stroke="#1e1e1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <!-- 지형 윤곽: 왼쪽 평지, 움푹 패인 골짜기, 오른쪽 평지 -->
      <path d="M40,190 C120,186 220,192 300,188 C350,192 392,280 400,420 C410,428 430,432 450,432 C470,432 490,428 500,420 C508,280 550,192 600,188 C680,192 780,186 860,190"/>
      <!-- 지면의 양 끝과 바닥 -->
      <path d="M40,190 L40,470 L860,470 L860,190"/>
      <!-- 위를 가로지르는 화살표 -->
      <path d="M150,96 C330,70 570,70 760,96" stroke-width="2" marker-end="url(#arrow)"/>
      <!-- 골짜기 가장자리에 선 사람 -->
      <circle cx="296" cy="140" r="9" fill="#ffffff"/>
      <path d="M296,149 L296,174 M296,156 L284,166 M296,156 L308,164 M296,174 L288,188 M296,174 L304,188"/>
    </g>
  </g>

  <g font-family="'Nanum Pen Script'" fill="#1e1e1e">
    <text x="450" y="60" text-anchor="middle" font-size="30">AI의 출력 속도와 양</text>
    <text x="450" y="518" text-anchor="middle" font-size="34">측정 가능성의 골짜기</text>

    <text x="170" y="238" text-anchor="middle" font-size="28">컴파일 ✓</text>
    <text x="170" y="275" text-anchor="middle" font-size="28">테스트 ✓</text>
    <text x="170" y="312" text-anchor="middle" font-size="28">린트 ✓</text>
    <text x="170" y="349" text-anchor="middle" font-size="28">CI ✓</text>
    <text x="170" y="385" text-anchor="middle" font-size="24" fill="#555">기계가 판정한다</text>

    <text x="730" y="238" text-anchor="middle" font-size="28">아키텍처 ?</text>
    <text x="730" y="275" text-anchor="middle" font-size="28">유지보수성 ?</text>
    <text x="730" y="312" text-anchor="middle" font-size="28">도메인 의미 ?</text>
    <text x="730" y="349" text-anchor="middle" font-size="28">진화 가능성 ?</text>
    <text x="730" y="385" text-anchor="middle" font-size="24" fill="#555">사람이 이해해야 판정한다</text>
  </g>
</svg>
