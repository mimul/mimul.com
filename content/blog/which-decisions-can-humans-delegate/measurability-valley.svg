<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <!-- 측정 가능성의 골: 기계가 판정하는 왼쪽 언덕과 사람의 이해가 필요한 오른쪽 언덕 사이 -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="h-green" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#eff6f0"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#bcdcc1" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-peach" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#fbf0ec"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#efc2b4" stroke-width="1.3"/>
    </pattern>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 왼쪽 언덕 -->
    <path d="M40,400 L40,190 C120,186 220,192 320,188 C352,230 362,300 372,380 L372,400 Z" fill="url(#h-green)"/>
    <!-- 오른쪽 언덕 -->
    <path d="M528,400 L528,380 C538,300 548,230 580,188 C680,192 780,186 860,190 L860,400 Z" fill="url(#h-peach)"/>
    <!-- 골짜기 바닥 -->
    <path d="M372,400 C410,412 490,412 528,400" fill="none"/>
    <!-- 위를 가로지르는 화살표 -->
    <path d="M150,96 C330,70 570,70 760,96" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 왼쪽 언덕 끝에 선 사람 -->
    <circle cx="332" cy="140" r="9" fill="#ffffff"/>
    <path d="M332,149 L332,174 M332,156 L320,166 M332,156 L344,164 M332,174 L324,188 M332,174 L340,188" fill="none"/>
  </g>

  <g font-family="'Nanum Pen Script'" fill="#1e1e1e">
    <text x="450" y="60" text-anchor="middle" font-size="30">AI의 출력 속도와 양</text>
    <text x="450" y="458" text-anchor="middle" font-size="34">측정 가능성의 골</text>

    <text x="180" y="238" text-anchor="middle" font-size="28">컴파일 ✓</text>
    <text x="180" y="275" text-anchor="middle" font-size="28">테스트 ✓</text>
    <text x="180" y="312" text-anchor="middle" font-size="28">린트 ✓</text>
    <text x="180" y="349" text-anchor="middle" font-size="28">CI ✓</text>
    <text x="180" y="385" text-anchor="middle" font-size="24" fill="#555">기계가 판정한다</text>

    <text x="720" y="238" text-anchor="middle" font-size="28">아키텍처 ?</text>
    <text x="720" y="275" text-anchor="middle" font-size="28">유지보수성 ?</text>
    <text x="720" y="312" text-anchor="middle" font-size="28">도메인 의미 ?</text>
    <text x="720" y="349" text-anchor="middle" font-size="28">진화 가능성 ?</text>
    <text x="720" y="385" text-anchor="middle" font-size="24" fill="#555">사람이 이해해야 판정한다</text>
  </g>
</svg>
