<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <!-- 상위 의사결정을 공유 멘탈 모델로 적어 두고, 하위 결정의 Evaluator로 쓰는 구조 -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="h-yellow" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#fcf7e8"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#eed9a6" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-blue" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#eef4fb"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#b9d3ee" stroke-width="1.3"/>
    </pattern>
    <pattern id="h-green" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-41)">
      <rect width="7" height="7" fill="#eff6f0"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#bcdcc1" stroke-width="1.3"/>
    </pattern>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>

  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 사람 -->
    <circle cx="110" cy="120" r="16" fill="#ffffff"/>
    <path d="M110,136 L110,186 M110,150 L86,170 M110,150 L134,170 M110,186 L92,218 M110,186 L128,218" fill="none"/>
    <!-- AI -->
    <rect x="80" y="330" width="60" height="50" rx="8" fill="#ffffff"/>
    <circle cx="100" cy="352" r="5" fill="#1e1e1e"/>
    <circle cx="120" cy="352" r="5" fill="#1e1e1e"/>
    <path d="M94,368 L126,368 M110,330 L110,316 M100,316 L120,316" fill="none"/>
    <!-- 두 화살표가 모델로 -->
    <path d="M150,160 C220,180 260,210 300,230" fill="none" marker-end="url(#arrow)"/>
    <path d="M150,350 C220,330 260,300 300,280" fill="none" marker-end="url(#arrow)"/>
    <!-- 모델 상자 -->
    <rect x="310" y="170" width="260" height="170" rx="6" fill="url(#h-yellow)"/>
    <path d="M330,250 L550,250" fill="none" stroke-dasharray="5,5"/>
    <!-- 평가 화살표 -->
    <path d="M570,255 L640,255" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 하위 결정 상자 -->
    <rect x="650" y="150" width="210" height="210" rx="6" fill="url(#h-blue)"/>
    <rect x="675" y="190" width="160" height="34" rx="4" fill="#ffffff"/>
    <rect x="675" y="238" width="160" height="34" rx="4" fill="#ffffff"/>
    <rect x="675" y="286" width="160" height="34" rx="4" fill="#ffffff"/>
    <!-- 체크/엑스 -->
    <path d="M808,200 L816,212 L832,196" fill="none" stroke="#3a7d4f" stroke-width="2.4"/>
    <path d="M808,248 L816,260 L832,244" fill="none" stroke="#3a7d4f" stroke-width="2.4"/>
    <path d="M812,294 L830,312 M830,294 L812,312" fill="none" stroke="#c9565e" stroke-width="2.4"/>
    <!-- 되돌아가는 화살표 -->
    <path d="M820,360 C800,420 500,430 440,350" fill="none" stroke-dasharray="6,6" marker-end="url(#arrow)"/>
  </g>

  <g font-family="'Nanum Pen Script'" fill="#1e1e1e" text-anchor="middle">
    <text x="110" y="250" font-size="26">사람</text>
    <text x="118" y="278" font-size="20" fill="#555">모델 바깥의 오해를 찾는다</text>
    <text x="440" y="156" font-size="21" fill="#555">예시는 컴파일 시점에 검증된다</text>
    <text x="110" y="412" font-size="26">AI</text>
    <text x="200" y="150" font-size="22" fill="#555">무엇이 올바른지</text>
    <text x="200" y="392" font-size="22" fill="#555">빠르게 초안·검증</text>
    <text x="440" y="212" font-size="30">실행 가능한 공유 멘탈 모델</text>
    <text x="440" y="240" font-size="22" fill="#555">(상위 의사결정을 적어 둔 것)</text>
    <text x="440" y="285" font-size="24">업무 데이터와 행위</text>
    <text x="440" y="318" font-size="24">기대하는 입출력 예시</text>
    <text x="605" y="240" font-size="24">평가</text>
    <text x="755" y="178" font-size="26">하위 결정과 코드</text>
    <text x="745" y="213" font-size="22">트랜잭션 방식</text>
    <text x="745" y="261" font-size="22">멱등성 방식</text>
    <text x="745" y="309" font-size="22">구체 코드</text>
    <text x="640" y="460" font-size="24" fill="#555">판정이 어긋나거나 빈칸이 남으면 모델의 해상도를 올린다</text>
  </g>
</svg>
